<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Easyship Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121d2d;
      --card: #1a2b3d;
      --text: #e9edf4;
      --muted: #9bb0c9;
      --accent: #e2a63b;
      --accent-soft: rgba(226,166,59,.15);
      --green: #4dd0b0;
      --danger: #ff7a7a;
      --line: rgba(255,255,255,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.02);
    }
    .brand { font-weight: 700; font-size: 1.2rem; }
    .actions { display: flex; gap: 10px; align-items: center; }
    .button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
    }
    .button.primary { background: var(--accent); color: #0d1522; }
    .button.secondary { background: transparent; border: 1px solid var(--line); color: var(--text); }
    .wrap {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px 80px;
    }
    .login-box, .table-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 16px 30px rgba(0,0,0,.18);
    }
    .login-box {
      max-width: 420px;
      margin: 80px auto 0;
    }
    .login-box h2, .table-box h2 {
      margin-top: 0;
      font-size: 1.5rem;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: .8rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .field input, .field select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1rem;
    }
    .hidden { display: none; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 12px 10px;
      text-align: left;
      vertical-align: top;
    }
    th { color: var(--muted); font-size: .76rem; letter-spacing: .08em; text-transform: uppercase; }
    .status-pill {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .status-btn {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      margin-right: 6px;
    }
    .notice {
      margin-top: 12px;
      min-height: 24px;
      color: var(--muted);
    }
    .error { color: var(--danger); }
    .ok { color: var(--green); }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Easyship Admin</div>
    <div class="actions">
      <button id="logoutBtn" class="button secondary hidden">Logout</button>
    </div>
  </div>

  <div class="wrap">
    <div id="loginView" class="login-box">
      <h2>Sign in</h2>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" value="admin" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" value="aerogram123" />
      </div>
      <button id="loginBtn" class="button primary" style="width:100%">Log in</button>
      <div id="loginMessage" class="notice"></div>
    </div>

    <div id="dashboardView" class="table-box hidden">
      <h2>Shipment management</h2>
      <div id="dashboardMessage" class="notice"></div>
      <table>
        <thead>
          <tr>
            <th>Track</th>
            <th>Route</th>
            <th>Status</th>
            <th>Mode</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="shipmentTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const loginView = document.getElementById('loginView');
    const dashboardView = document.getElementById('dashboardView');
    const loginMessage = document.getElementById('loginMessage');
    const dashboardMessage = document.getElementById('dashboardMessage');
    const logoutBtn = document.getElementById('logoutBtn');
    const shipmentTableBody = document.getElementById('shipmentTableBody');

    async function checkSession() {
      try {
        const response = await fetch('/api/admin/session', { credentials: 'include' });
        const data = await response.json();
        if (data.authenticated) {
          showDashboard();
          loadShipments();
        } else {
          showLogin();
        }
      } catch (error) {
        showLogin();
      }
    }

    function showLogin() {
      loginView.classList.remove('hidden');
      dashboardView.classList.add('hidden');
      logoutBtn.classList.add('hidden');
    }

    function showDashboard() {
      loginView.classList.add('hidden');
      dashboardView.classList.remove('hidden');
      logoutBtn.classList.remove('hidden');
    }

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      loginMessage.className = 'notice';
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });
        const data = await response.json();
        if (!response.ok) {
          loginMessage.classList.add('error');
          loginMessage.textContent = data.error || 'Login failed';
          return;
        }
        loginMessage.classList.add('ok');
        loginMessage.textContent = 'Logged in successfully.';
        showDashboard();
        loadShipments();
      } catch (error) {
        loginMessage.classList.add('error');
        loginMessage.textContent = 'Unable to reach server.';
      }
    }

    async function logout() {
      try {
        await fetch('/api/admin/logout', {
          method: 'POST',
          credentials: 'include'
        });
      } catch (error) {}
      showLogin();
      document.getElementById('password').value = '';
    }

    async function loadShipments() {
      try {
        const response = await fetch('/api/admin/shipments', { credentials: 'include' });
        if (!response.ok) {
          throw new Error('Unauthorized');
        }
        const shipments = await response.json();
        shipmentTableBody.innerHTML = shipments.map((shipment) => `
          <tr>
            <td><strong>${shipment.track || '—'}</strong></td>
            <td>${shipment.from || '—'} → ${shipment.to || '—'}</td>
            <td><span class="status-pill">${shipment.status || 'Booked'}</span></td>
            <td>${shipment.mode || 'ship'}</td>
            <td>
              <button class="status-btn" data-track="${shipment.track}" data-status="Booked">Booked</button>
              <button class="status-btn" data-track="${shipment.track}" data-status="In transit">In transit</button>
              <button class="status-btn" data-track="${shipment.track}" data-status="Delivered">Delivered</button>
            </td>
          </tr>
        `).join('');
        dashboardMessage.textContent = shipments.length ? 'Shipment records loaded.' : 'No shipments yet.';
      } catch (error) {
        dashboardMessage.className = 'notice error';
        dashboardMessage.textContent = 'Session expired or unauthorized.';
        showLogin();
      }
    }

    async function updateStatus(track, status) {
      try {
        const response = await fetch(`/api/admin/shipments/${encodeURIComponent(track)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ status })
        });
        if (!response.ok) {
          throw new Error('Unable to update');
        }
        dashboardMessage.className = 'notice ok';
        dashboardMessage.textContent = 'Shipment status updated.';
        loadShipments();
      } catch (error) {
        dashboardMessage.className = 'notice error';
        dashboardMessage.textContent = 'Update failed.';
      }
    }

    document.getElementById('loginBtn').addEventListener('click', login);
    logoutBtn.addEventListener('click', logout);
    shipmentTableBody.addEventListener('click', (event) => {
      const button = event.target.closest('.status-btn');
      if (!button) return;
      updateStatus(button.dataset.track, button.dataset.status);
    });

    document.getElementById('password').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') login();
    });

    checkSession();
  </script>
</body>
</html>
